<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Một vầng trăng cho em</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Be+Vietnam+Pro:wght@300;400&display=swap">
<style>
:root{--ink:#0e1624;--moon:#efe9d8;--wood:#9a5b34;--silk:#d8bd84;--mist:#8fa1b8;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--moon);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:300;overflow:hidden;-webkit-tap-highlight-color:transparent}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
.scene.on{opacity:1;pointer-events:auto}
button{font:inherit;color:var(--moon);background:none;border:1px solid var(--silk);border-radius:999px;padding:12px 26px;cursor:pointer;font-size:15px}
button:focus-visible,.string:focus-visible{outline:2px solid var(--silk);outline-offset:4px}
.moon{width:min(62vw,260px);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 36% 32%,#fffbea,var(--moon) 45%,#bdb6a0 100%);box-shadow:0 0 90px 20px rgba(239,233,216,.22);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 130px 36px rgba(239,233,216,.34);transform:scale(1.03)}}
.hint{color:var(--mist);font-size:15px;letter-spacing:.02em}
.say{min-height:7.2em;display:flex;align-items:center;font-size:clamp(25px,7vw,34px);line-height:1.3;max-width:20em;transition:opacity .6s}
.dots{display:flex;gap:10px}.dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--silk)}.dots i.f{background:var(--silk)}
#lute{width:min(100%,430px);touch-action:none;overflow:visible}
.string{cursor:pointer}
.slides{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;padding:6px 10vw;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.card{flex:0 0 80vw;max-width:340px;scroll-snap-align:center;background:var(--moon);color:var(--ink);padding:12px 12px 16px;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card:nth-child(odd){transform:rotate(-1.4deg)}.card:nth-child(even){transform:rotate(1.2deg)}
.card img{display:block;width:100%;height:min(46vh,380px);object-fit:cover;border-radius:2px}
.card p{margin-top:12px;font-size:15px;line-height:1.5}
.sign{color:var(--silk);font-size:26px}
@media(prefers-reduced-motion:reduce){.moon{animation:none}.scene,.say{transition:none}}
</style>
</head>
<body>

<main class="scene on" id="s0">
  <button class="moon" id="moon" aria-label="Chạm vào trăng"></button>
  <p class="say serif" style="min-height:0;justify-content:center">Chúc em ngủ ngon</p>
</main>

    <path id="s_d" d="M10 235H390" stroke="#d8bd84" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path id="h_a" class="string" d="M10 70H390" stroke="transparent" stroke-width="44" fill="none" tabindex="0" role="button" aria-label="Dây 1"/>

  <button id="toPhotos" hidden>Xem những tấm ảnh</button>
</section>

<section class="scene" id="s3">
  <p class="sign serif" style="font-size:clamp(30px,9vw,44px);line-height:1.25">Thằng chồng siêu đẹp zai</p>
  <button id="again">Nghe lại từ đầu</button>
</section>

<script>
const LINES=[
 "Xin chào đồ đáng yêu cáu kỉnh",
 "a.k.a Thủy thủ mặt trăng (tròn)",
 "Chúc cả đoàn thi tốt, đạt giải",
 "Quỳnh Mai VÔ ĐỊCH"
];
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id))};
let AC,cache={};
function pluck(f){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const sr=AC.sampleRate;
    if(!cache[f]){
      const n=Math.round(sr/f),len=sr*2,b=AC.createBuffer(1,len,sr),d=b.getChannelData(0),r=new Float32Array(n);
      for(let i=0;i<n;i++)r[i]=Math.random()*2-1;
      for(let i=0,j=0;i<len;i++,j=(j+1)%n){d[i]=r[j];r[j]=.4985*(r[j]+r[(j+1)%n])}
      cache[f]=b;
    }
    const s=AC.createBufferSource(),g=AC.createGain(),lp=AC.createBiquadFilter();
    s.buffer=cache[f];lp.type='lowpass';lp.frequency.value=2600;g.gain.value=.55;
    s.connect(lp);lp.connect(g);g.connect(AC.destination);s.start();
  }catch(e){}
}
$('moon').onclick=()=>show('s1');
// lute
const dots=$('dots');LINES.forEach(()=>dots.appendChild(document.createElement('i')));
let n=0;const say=$('say');
const STR={a:{y:70,f:196},b:{y:125,f:261.63},c:{y:180,f:293.66},d:{y:235,f:392}};
function vibrate(k){
  const {y}=STR[k],el=$('s_'+k),t0=performance.now();
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  (function frame(now){
    const t=(now-t0)/1000,a=reduce?0:16*Math.exp(-3.2*t)*Math.cos(t*38);
    if(t>1.6){el.setAttribute('d',`M10 ${y}H390`);return}
    el.setAttribute('d',`M10 ${y}Q200 ${y+a} 390 ${y}`);requestAnimationFrame(frame);
  })(t0);
}
function hit(k){
  pluck(STR[k].f);vibrate(k);
  if(n<LINES.length){
    say.style.opacity=0;
    const i=n++;
    setTimeout(()=>{say.textContent=LINES[i];say.style.opacity=1},300);
    dots.children[i].classList.add('f');
    if(n===LINES.length)setTimeout(()=>{$('toPhotos').hidden=false},1800);
  }
}
['a','b','c','d'].forEach(k=>{const h=$('h_'+k);
  h.addEventListener('pointerdown',()=>hit(k));
  h.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(k)}});
});
$('toPhotos').onclick=()=>show('s2');
$('toEnd').onclick=()=>show('s3');
$('again').onclick=()=>{n=0;say.textContent='Chạm vào dây đàn.';[...dots.children].forEach(d=>d.classList.remove('f'));$('toPhotos').hidden=true;$('slides').scrollLeft=0;show('s0')};
</script>
